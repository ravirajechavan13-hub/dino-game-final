name: Build Signed Play Store AAB

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android Release AAB
        run: |
          npm install
          cordova platform add android
          cordova build android --release -- --packageType=bundle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Sign AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" platforms/android/app/build/outputs/bundle/release/app-release.aab ${{ secrets.KEY_ALIAS }}

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: platforms/android/app/build/outputs/bundle/release/app-release.aab
          
